{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Edit Trek</h3>
    <a href="{{ url_for('admin_treks') }}" class="btn btn-secondary btn-sm">
        Back to Treks
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form action="{{ url_for('admin_trek_edit', trek_id=trek.id) }}" method="POST">

            <div class="mb-3">
                <label class="form-label">Trek Name</label>
                <input type="text" name="name" class="form-control"
                       value="{{ trek.name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control"
                       value="{{ trek.location }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control"
                          rows="3">{{ trek.description }}</textarea>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Difficulty</label>
                    <select name="difficulty" class="form-select" required>
                        <option value="Easy"
                            {% if trek.difficulty == 'Easy' %}selected{% endif %}>
                            Easy
                        </option>
                        <option value="Moderate"
                            {% if trek.difficulty == 'Moderate' %}selected{% endif %}>
                            Moderate
                        </option>
                        <option value="Hard"
                            {% if trek.difficulty == 'Hard' %}selected{% endif %}>
                            Hard
                        </option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Duration (days)</label>
                    <input type="number" name="duration_days" class="form-control"
                           value="{{ trek.duration_days }}" min="1" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Price (₹)</label>
                    <input type="number" name="price" class="form-control"
                           value="{{ trek.price }}" step="0.01" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Total Seats</label>
                    <input type="number" name="total_seats" class="form-control"
                           value="{{ trek.total_seats }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Available Slots</label>
                    <input type="number" name="available_slots" class="form-control"
                           value="{{ trek.available_slots }}" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select" required>
                        <option value="Pending"
                            {% if trek.status == 'Pending' %}selected{% endif %}>
                            Pending
                        </option>
                        <option value="Approved"
                            {% if trek.status == 'Approved' %}selected{% endif %}>
                            Approved
                        </option>
                        <option value="Open"
                            {% if trek.status == 'Open' %}selected{% endif %}>
                            Open
                        </option>
                        <option value="Closed"
                            {% if trek.status == 'Closed' %}selected{% endif %}>
                            Closed
                        </option>
                        <option value="Completed"
                            {% if trek.status == 'Completed' %}selected{% endif %}>
                            Completed
                        </option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control"
                           value="{{ trek.start_date }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">End Date</label>
                    <input type="date" name="end_date" class="form-control"
                           value="{{ trek.end_date }}" required>
                </div>
            </div>

            <button type="submit" class="btn btn-warning w-100">Update Trek</button>
        </form>
    </div>
</div>

{% endblock %}
