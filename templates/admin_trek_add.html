{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>Add New Trek</h3>
    <a href="{{ url_for('admin_treks') }}" class="btn btn-secondary btn-sm">
        Back to Treks
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form action="{{ url_for('admin_trek_add') }}" method="POST">

            <div class="mb-3">
                <label class="form-label">Trek Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Difficulty</label>
                    <select name="difficulty" class="form-select" required>
                        <option value="" disabled selected>Select</option>
                        <option value="Easy">Easy</option>
                        <option value="Moderate">Moderate</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Duration (days)</label>
                    <input type="number" name="duration_days" class="form-control" min="1" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Price (₹)</label>
                    <input type="number" name="price" class="form-control" min="0" step="0.01" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Total Seats</label>
                    <input type="number" name="total_seats" class="form-control" min="1" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Start Date</label>
                    <input type="date" name="start_date" class="form-control" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Create Trek</button>
        </form>
    </div>
</div>

{% endblock %}
