openapi: 3.0.0

info:
  title: Trekking Management System - API
  description: >
    Server-rendered Flask app - routes return HTML, not JSON.
    Auth via Flask sessions. Roles: Admin, Trek Staff, Trekker.
  version: 1.0.0

servers:
  - url: http://127.0.0.1:5000

paths:

  # ---------- public ----------
  /:
    get: { summary: "Home page [public]" }

  /login:
    get: { summary: "Login form [public]" }
    post: { summary: "Handle login - checks credentials, blacklist, approval [public]" }

  /register:
    get: { summary: "Register form [public]" }
    post: { summary: "Handle registration - Trekker auto-approved, Trek Staff needs admin approval [public]" }

  /logout:
    get: { summary: "Clear session, redirect to login [public]" }

  # ---------- admin ----------
  /admin/dashboard:
    get: { summary: "Stat cards: total treks, trekkers, staff, bookings [admin]" }

  /admin/treks:
    get: { summary: "List all treks [admin]" }

  /admin/treks/add:
    get: { summary: "Add-trek form [admin]" }
    post: { summary: "Create trek [admin]" }

  /admin/treks/edit/{trek_id}:
    get: { summary: "Edit-trek form, pre-filled [admin]" }
    post: { summary: "Save trek edits [admin]" }

  /admin/treks/delete/{trek_id}:
    get: { summary: "Delete a trek [admin]" }

  /admin/staff:
    get: { summary: "List staff + assign-to-trek form [admin]" }

  /admin/staff/assign:
    post: { summary: "Assign staff member to a trek [admin]" }

  /admin/staff/remove/{user_id}:
    get: { summary: "Unassign a staff member [admin]" }

  /admin/staff/blacklist/{user_id}:
    get: { summary: "Toggle blacklist for a staff member [admin]" }

  /admin/pending-staff:
    get: { summary: "List staff awaiting approval [admin]" }

  /admin/approve-staff/{user_id}:
    get: { summary: "Approve a pending staff account [admin]" }

  /admin/users:
    get: { summary: "List all trekkers [admin]" }

  /admin/users/blacklist/{user_id}:
    get: { summary: "Toggle blacklist for a trekker [admin]" }

  /admin/bookings:
    get: { summary: "View all bookings [admin]" }

  /admin/search:
    get: { summary: "Search treks/users/staff by name or ID [admin]" }

  # ---------- staff ----------
  /staff/dashboard:
    get: { summary: "Assigned treks + booking counts [staff]" }

  /staff/trek/{trek_id}:
    get: { summary: "Trek detail + registered trekkers (must be assigned) [staff]" }

  /staff/trek/{trek_id}/update:
    post: { summary: "Update slots/status - Completed cascades to bookings [staff]" }

  /staff/profile:
    get: { summary: "View profile [staff]" }
    post: { summary: "Update name/phone/password [staff]" }

  # ---------- trekker ----------
  /trekker/dashboard:
    get: { summary: "Open treks + this trekker's active bookings [trekker]" }

  /trekker/treks:
    get: { summary: "Browse/filter open treks by difficulty, location [trekker]" }

  /trekker/book/{trek_id}:
    post: { summary: "Book a trek - checks Open, slots, not already booked [trekker]" }

  /trekker/cancel/{booking_id}:
    post: { summary: "Cancel a booking, restore the slot [trekker]" }

  /trekker/bookings:
    get: { summary: "View booking history [trekker]" }

  /trekker/profile:
    get: { summary: "View profile [trekker]" }
    post: { summary: "Update name/phone/password [trekker]" }